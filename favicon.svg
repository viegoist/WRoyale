<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)" stroke="#3b0764" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="url(#accentGrad)" opacity="0.18" filter="url(#glow)" />
  
  <!-- Wizard Hat & Magic Social Pulse -->
  <path d="M256 80 L350 290 L162 290 Z" fill="url(#hatGrad)" />
  <path d="M110 290 C 170 268, 342 268, 402 290 C 428 310, 398 332, 368 332 C 298 320, 214 320, 144 332 C 114 332, 86 310, 110 290 Z" fill="#9333ea" />
  
  <!-- Magic Star & Connection Nodes -->
  <path d="M256 165 L263 185 L285 192 L263 199 L256 219 L249 199 L227 192 L249 185 Z" fill="#fef08a" filter="url(#glow)"/>
  
  <!-- Social Orbit Nodes -->
  <circle cx="370" cy="150" r="16" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="140" cy="190" r="12" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="390" cy="240" r="10" fill="#facc15" filter="url(#glow)"/>
  <path d="M370 150 Q 256 100 140 190" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-dasharray="6,6" fill="none"/>
</svg>
